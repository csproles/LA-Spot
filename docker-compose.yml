# Place this file at the REPO ROOT (same level as .env.example)
#
# This file is the safe-by-default setup (Production, demo mode off, sign-in via
# Google required). For everyday local use, docker-compose.override.yml sits next
# to it and `docker compose up` merges it in automatically, switching on
# Development mode and the "Try the demo" button.
#
# To deploy for real, ignore the override:
#     docker compose -f docker-compose.yml up -d --build

services:
  python-api:
    build:
      # Repo root, not the Python subdir: v5_detector.py needs sibling
      # packages (Code/, revised_abcd/, pipeline_v5/) copied into the image too.
      context: .
      dockerfile: MelanomaDetection/MelanomaDetection.Python/Dockerfile
    # Not published to the host: only the web container calls this API, over the
    # compose network. That keeps SKINCHECK_INTERNAL_KEY from being the only thing
    # standing between the internet and people's data. To poke at it from the host
    # while debugging, temporarily add:  ports: ["127.0.0.1:5002:5002"]
    expose:
      - "5002"
    env_file:
      - .env   # provides OPENAI_API_KEY (only for "Get AI Explanation")
    environment:
      # Tracked spots, saved checks and risk profiles live in this SQLite file
      # on the named volume below, so they survive container rebuilds. Use the
      # web app's demo account for a clean-slate walkthrough.
      - SKINCHECK_DB=/app/data/skincheck.db
      # Required: compose refuses to start without it, and Flask refuses to run
      # without it, so the X-User-Id header is never trusted from an anonymous caller.
      - SKINCHECK_INTERNAL_KEY=${SKINCHECK_INTERNAL_KEY:?Set SKINCHECK_INTERNAL_KEY in .env (any long random string)}
    volumes:
      - skincheck-data:/app/data
      # Kaggle-trained melanoma risk model weights (risk_model.py). Large,
      # gitignored binaries -- never baked into the image; bind-mount the
      # host's repo-root models/ folder (see NOTES.md "Setup") read-only.
      - ./models:/app/models:ro
    # Analysis results are held in memory (bounded, see resultstore.py); this is
    # part of the backstop, but the real floor is risk_model.py's own models:
    # RiskModel loads 5 separate ConvNeXt-Base CNNs (fp32 in memory regardless
    # of the fp16 checkpoint files on disk, since load_state_dict upcasts to
    # match the model's own dtype) plus their PCA/CatBoost pairs and a second
    # YOLO model, alongside V5Detector's own YOLO model. ~1.8GB just for the
    # 5 CNNs' weights. 1g was sized for V5Detector alone and OOM-kills the
    # gunicorn worker (SIGKILL) once RiskModel also loads at startup.
    mem_limit: 4g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # /health can't respond until main.py finishes importing, which loads
      # every model (V5Detector's YOLO + RiskModel's 5 CNNs/PCAs/CatBoosts)
      # synchronously first. Failed checks during start_period don't count
      # against retries, so a slow cold start doesn't get marked unhealthy
      # before the app has had a real chance to finish loading.
      start_period: 90s

  web:
    build:
      context: ./MelanomaDetection/MelanomaDetection.Web
      dockerfile: Dockerfile
    ports:
      - "7001:8080"
    env_file:
      - .env   # provides GoogleMaps__ApiKey, Authentication__Google__* and Provider__AllowedEmails (dotnet user-secrets isn't visible inside the container)
    environment:
      # Overrides Program.cs's FlaskApi:BaseUrl to point at the Flask container by
      # its service name instead of localhost -- Docker Compose gives each service
      # its own DNS name on the shared network automatically.
      - FlaskApi__BaseUrl=http://python-api:5002
      # The same secret Flask reads as SKINCHECK_INTERNAL_KEY, so Flask can trust
      # the X-User-Id header this app sends.
      - FlaskApi__InternalKey=${SKINCHECK_INTERNAL_KEY:?Set SKINCHECK_INTERNAL_KEY in .env (any long random string)}
      # Accounts database and cookie-encryption keys live on the volume below, so
      # sign-ins survive a container rebuild.
      - ConnectionStrings__SkinCheck=Data Source=/app/data/skincheck-users.db
      - DataProtection__KeysDirectory=/app/data/keys
      # Production: no developer error pages, HTTPS-only cookies, and startup
      # fails loudly if Google sign-in or the shared key is missing. Sign-in
      # cookies are HTTPS-only here, so put a TLS-terminating proxy in front (see README).
      - ASPNETCORE_ENVIRONMENT=Production
      - Demo__Enabled=false
    volumes:
      - web-data:/app/data
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      python-api:
        condition: service_healthy

volumes:
  skincheck-data:
  web-data:
