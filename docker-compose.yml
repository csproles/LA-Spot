# Place this file at the REPO ROOT (same level as .env.example)

services:
  python-api:
    build:
      context: ./MelanomaDetection/MelanomaDetection.Python
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - .env   # provides OPENAI_API_KEY (only for "Get AI Explanation") and SKINCHECK_INTERNAL_KEY
    environment:
      # Tracked spots, saved checks and risk profiles live in this SQLite file
      # on the named volume below, so they survive container rebuilds. Use the
      # web app's demo account for a clean-slate walkthrough.
      - SKINCHECK_DB=/app/data/skincheck.db
    volumes:
      - skincheck-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./MelanomaDetection/MelanomaDetection.Web
      dockerfile: Dockerfile
    ports:
      - "7001:8080"
    env_file:
      - .env   # provides GoogleMaps__ApiKey and Authentication__Google__* (dotnet user-secrets isn't visible inside the container)
    environment:
      # Overrides Program.cs's FlaskApi:BaseUrl to point at the Flask container by
      # its service name instead of localhost -- Docker Compose gives each service
      # its own DNS name on the shared network automatically.
      - FlaskApi__BaseUrl=http://python-api:5002
      # The same secret Flask reads as SKINCHECK_INTERNAL_KEY, so Flask can trust
      # the X-User-Id header this app sends.
      - FlaskApi__InternalKey=${SKINCHECK_INTERNAL_KEY}
      # Accounts database and cookie-encryption keys live on the volume below, so
      # sign-ins survive a container rebuild.
      - ConnectionStrings__SkinCheck=Data Source=/app/data/skincheck-users.db
      - DataProtection__KeysDirectory=/app/data/keys
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - web-data:/app/data
    depends_on:
      python-api:
        condition: service_healthy

volumes:
  skincheck-data:
  web-data:
