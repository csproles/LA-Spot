<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline - LA Spot</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Work Sans", system-ui, sans-serif;
            background: light-dark(#F3EFE3, #12161A);
            color: light-dark(#1F2937, #F4F6F5);
            padding: 24px;
        }

        .card {
            max-width: 360px;
            text-align: center;
            background: light-dark(#FFFFFF, #1E252B);
            border-radius: 15px;
            box-shadow: 0 1px 2px light-dark(rgba(47, 74, 60, 0.1), rgba(0, 0, 0, 0.3));
            padding: 32px 28px;
        }

        /* The mascot is a mask filled with the brand green, so it sits straight
           on the card in either theme (same treatment as the app's sign-in page). */
        .mark {
            width: 88px;
            height: 88px;
            margin: 0 auto 14px;
            background-color: light-dark(#2F4A3C, #9EC2AE);
            -webkit-mask: url(icons/mascot.png) center / contain no-repeat;
            mask: url(icons/mascot.png) center / contain no-repeat;
        }

        h1 {
            font-family: "Manrope", system-ui, sans-serif;
            font-size: 19px;
            margin: 0 0 8px;
            color: light-dark(#2F4A3C, #9EC2AE);
        }

        p {
            font-size: 14px;
            color: light-dark(#24323F, #C2CAD1);
            margin: 0 0 20px;
            line-height: 1.5;
        }

        button {
            font-family: inherit;
            font-weight: 700;
            font-size: 14px;
            color: light-dark(#F6F8F5, #0B0F13);
            background: light-dark(#2F4A3C, #9EC2AE);
            border: none;
            border-radius: 9px;
            padding: 10px 20px;
            cursor: pointer;
        }

        button:hover {
            background: light-dark(#243A2E, #B2D2C0);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <h1>You're offline</h1>
        <p>LA Spot needs a live connection to analyze photos and load your data. Reconnect and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
