<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- A: Asymmetry: an irregular blob whose two halves don't mirror, with
       a dashed axis line standing in for the mirror-overlap comparison. -->
  <g transform="translate(60,70) rotate(-8)">
    <path d="M0,20 C-18,5 -14,-22 8,-26 C30,-30 42,-10 38,10 C34,30 14,38 -4,34 C-14,32 -10,26 0,20 Z"
          fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
    <line x1="6" y1="-28" x2="6" y2="36" stroke="#fff" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round" />
  </g>

  <!-- B: Border irregularity: a notched, uneven outline instead of a smooth circle. -->
  <g transform="translate(300,90) rotate(12)">
    <path d="M0,-30 C10,-30 16,-24 22,-18 C30,-12 32,-2 26,4 C34,10 30,22 20,24 C22,32 10,36 2,30
             C-6,38 -20,34 -22,24 C-32,24 -36,12 -28,4 C-36,-4 -30,-18 -18,-20 C-16,-28 -8,-32 0,-30 Z"
          fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- C: Color variation: an outline with uneven internal patches instead of one flat fill. -->
  <g transform="translate(90,260) rotate(4)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="6" />
    <circle cx="-10" cy="-8" r="7" fill="#fff" />
    <circle cx="8" cy="6" r="5" fill="#fff" />
    <circle cx="6" cy="-14" r="3.5" fill="#fff" />
  </g>

  <!-- D: Diameter: a circle with a measured line across it, ticked at both ends. -->
  <g transform="translate(320,300) rotate(-6)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#fff" stroke-width="6" />
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="-28" y1="-6" x2="-28" y2="6" stroke="#fff" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="-6" x2="28" y2="6" stroke="#fff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- E: Evolving: two overlapping outlines (before/after) with a small change arrow. -->
  <g transform="translate(200,190) rotate(-10)">
    <circle cx="-8" cy="0" r="20" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="4 5" />
    <circle cx="10" cy="4" r="26" fill="none" stroke="#fff" stroke-width="6" />
    <path d="M34,4 L46,4 M40,-2 L46,4 L40,10" fill="none" stroke="#fff" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
